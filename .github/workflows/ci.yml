name: doctrine-platform-consumer-ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: doctrine-demo-platform-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Doctrine Platform App CI
    uses: flobehejohn/doctrine-platform/.github/workflows/reusable-frontend-ci.yml@main
    with:
      project_name: doctrine-demo
      node_version: "20"
      working_directory: app
      audit_dir: audit/root-app
    secrets: inherit

  container:
    name: Doctrine Platform Container Smoke
    uses: flobehejohn/doctrine-platform/.github/workflows/reusable-container-smoke.yml@main
    needs: app
    with:
      project_name: doctrine-demo
      image_name: doctrine-demo
      dockerfile_path: app/Dockerfile
      build_context: app
      container_port: "8080"
      healthcheck_path: /healthz
      audit_dir: audit/root-container
    secrets: inherit
