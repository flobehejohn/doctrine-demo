name: staff-ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: staff-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Core validation without Docker
        shell: pwsh
        run: ./scripts/validate-full.ps1 -SkipDocker -OutDir audit -Archive
      - name: Upload core audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctrine-demo-core-audit-${{ github.run_number }}-${{ github.sha }}
          path: audit/**
          if-no-files-found: warn
          retention-days: 21

  container:
    name: Container Build & Smoke
    runs-on: ubuntu-latest
    needs: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Full validation with Docker
        shell: pwsh
        run: ./scripts/validate-full.ps1 -OutDir audit -Archive
      - name: Upload container audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doctrine-demo-container-audit-${{ github.run_number }}-${{ github.sha }}
          path: audit/**
          if-no-files-found: warn
          retention-days: 21
