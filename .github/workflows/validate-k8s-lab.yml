name: validate-k8s-lab

on:
  push:
    paths:
      - 'labs/doctrine-z-ai-delivery-k8s-lab/**'
      - '.github/workflows/validate-k8s-lab.yml'
  pull_request:
    paths:
      - 'labs/doctrine-z-ai-delivery-k8s-lab/**'
      - '.github/workflows/validate-k8s-lab.yml'
  workflow_dispatch:

concurrency:
  group: validate-k8s-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: App, Docker and Kustomize gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: App syntax check
        working-directory: labs/doctrine-z-ai-delivery-k8s-lab/app
        run: node --check server.js

      - name: Install app dependencies
        working-directory: labs/doctrine-z-ai-delivery-k8s-lab/app
        run: npm install

      - name: Contract tests
        working-directory: labs/doctrine-z-ai-delivery-k8s-lab/app
        run: npm test

      - name: Docker build without push
        run: docker build -t doctrine-z-ai-delivery-k8s-lab:ci labs/doctrine-z-ai-delivery-k8s-lab/app

      - name: Validate Kustomize overlays
        run: |
          kubectl kustomize labs/doctrine-z-ai-delivery-k8s-lab/k8s/overlays/dev > /tmp/doctrine-z-k8s-lab-dev.yaml
          kubectl kustomize labs/doctrine-z-ai-delivery-k8s-lab/k8s/overlays/prod > /tmp/doctrine-z-k8s-lab-prod.yaml
          test -s /tmp/doctrine-z-k8s-lab-dev.yaml
          test -s /tmp/doctrine-z-k8s-lab-prod.yaml

      - name: Anti-secret and positioning guard
        run: |
          ! grep -RInE '(sk-[A-Za-z0-9]|OPENAI_API_KEY|ANTHROPIC_API_KEY|MISTRAL_API_KEY|GEMINI_API_KEY)' labs/doctrine-z-ai-delivery-k8s-lab
          grep -RIn 'mock-llm' labs/doctrine-z-ai-delivery-k8s-lab/app labs/doctrine-z-ai-delivery-k8s-lab/k8s labs/doctrine-z-ai-delivery-k8s-lab/docs >/dev/null
          grep -RIn 'ne prétend pas être une plateforme Kubernetes production' labs/doctrine-z-ai-delivery-k8s-lab >/dev/null
