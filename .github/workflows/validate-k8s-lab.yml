name: validate-k8s-lab

on:
  push:
    paths:
      - 'labs/doctrine-z-ai-delivery-k8s-lab/**'
      - '.github/workflows/validate-k8s-lab.yml'
  pull_request:
    paths:
      - 'labs/doctrine-z-ai-delivery-k8s-lab/**'
      - '.github/workflows/validate-k8s-lab.yml'
  workflow_dispatch:

concurrency:
  group: validate-k8s-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Doctrine Platform Lab App CI
    uses: flobehejohn/doctrine-platform/.github/workflows/reusable-frontend-ci.yml@main
    with:
      project_name: doctrine-z-ai-delivery-k8s-lab
      node_version: "20"
      working_directory: labs/doctrine-z-ai-delivery-k8s-lab/app
      audit_dir: audit/k8s-lab
    secrets: inherit

  container:
    name: Doctrine Platform Lab Container Smoke
    uses: flobehejohn/doctrine-platform/.github/workflows/reusable-container-smoke.yml@main
    needs: app
    with:
      project_name: doctrine-z-ai-delivery-k8s-lab
      image_name: doctrine-z-ai-delivery-k8s-lab
      dockerfile_path: labs/doctrine-z-ai-delivery-k8s-lab/app/Dockerfile
      build_context: labs/doctrine-z-ai-delivery-k8s-lab/app
      container_port: "3000"
      healthcheck_path: /healthz
      audit_dir: audit/k8s-lab
    secrets: inherit

  kustomize:
    name: Doctrine Platform Lab Kustomize Validation
    uses: flobehejohn/doctrine-platform/.github/workflows/reusable-kustomize-validate.yml@main
    needs: app
    with:
      project_name: doctrine-z-ai-delivery-k8s-lab
      dev_overlay_path: labs/doctrine-z-ai-delivery-k8s-lab/k8s/overlays/dev
      prod_overlay_path: labs/doctrine-z-ai-delivery-k8s-lab/k8s/overlays/prod
      audit_dir: audit/k8s-lab
    secrets: inherit
