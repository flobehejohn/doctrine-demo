name: curated-p95-panel

on:
  push:
    branches:
      - fix/p95-latency-panel-values-20260509
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-curated-p95-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode curated P95 panel and refresh evidence
        shell: bash
        run: |
          set -euo pipefail
          base64 -d audit/demo_audit/images/panel_02.curated.b64 > audit/demo_audit/images/panel_02.png
          cat > audit/demo_audit/p95.csv <<'CSV'
          "series","last","max","avg","slo","unit"
          "global",0.0475,0.0475,0.0475,0.3000,"seconds"
          CSV
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from datetime import datetime, timezone

          root = Path('.')
          proof = root / 'audit' / 'demo_audit'
          patterns = {'.html', '.pdf', '.csv', '.json', '.png', '.gif', '.svg', '.txt', '.log', '.b64'}

          def kind(path: Path) -> str:
              name = path.name.lower()
              ext = path.suffix.lower()
              if name.endswith('report.html'):
                  return 'report-html'
              if name.endswith('report.pdf'):
                  return 'report-pdf'
              if name.endswith('alerts.json'):
                  return 'prometheus-alerts'
              if name.endswith('targets.json'):
                  return 'prometheus-targets'
              if 'p95' in name or 'latency' in name:
                  return 'latency'
              if 'rps' in name or 'requests' in name:
                  return 'traffic'
              if '5xx' in name or 'error' in name:
                  return 'errors'
              if 'cpu' in name:
                  return 'cpu'
              if 'mem' in name or 'memory' in name or 'ram' in name:
                  return 'memory'
              if ext == '.png':
                  return 'grafana-panel'
              if ext == '.csv':
                  return 'timeseries-csv'
              if ext == '.b64':
                  return 'curated-panel-source'
              return 'supporting-artifact'

          files = sorted([p for p in proof.rglob('*') if p.is_file() and p.suffix.lower() in patterns])
          entries = []
          for p in files:
              raw = p.read_bytes()
              entries.append({
                  'path': './' + p.as_posix(),
                  'name': p.name,
                  'kind': kind(p),
                  'extension': p.suffix,
                  'sizeBytes': len(raw),
                  'sizeKB': round(len(raw) / 1024, 2),
                  'sha256': hashlib.sha256(raw).hexdigest().upper(),
              })

          grouped = {}
          for e in entries:
              grouped.setdefault(e['kind'], {'kind': e['kind'], 'count': 0, 'sizeBytes': 0})
              grouped[e['kind']]['count'] += 1
              grouped[e['kind']]['sizeBytes'] += e['sizeBytes']

          summary = {
              'generatedAt': datetime.now(timezone.utc).isoformat(),
              'proofRoot': 'audit/demo_audit',
              'found': proof.exists(),
              'count': len(entries),
              'totalSizeMB': round(sum(e['sizeBytes'] for e in entries) / (1024 * 1024), 2),
              'byKind': [
                  {'kind': g['kind'], 'count': g['count'], 'sizeMB': round(g['sizeBytes'] / (1024 * 1024), 2)}
                  for g in sorted(grouped.values(), key=lambda item: item['kind'])
              ],
              'files': entries,
          }

          out_json = root / 'docs/proofs/observability-evidence.json'
          out_json.write_text(json.dumps(summary, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          lines = [
              '# Observability Evidence Index', '',
              f"Generated: {summary['generatedAt']}", '',
              'Proof root: `audit/demo_audit`', '',
              f"Found: {str(summary['found']).lower()}", '',
              f"Artifacts: {summary['count']}", '',
              f"Total size: {summary['totalSizeMB']} MB", '',
              '## Summary by kind', '',
              '| Kind | Count | Size MB |',
              '| --- | ---: | ---: |',
          ]
          for g in summary['byKind']:
              lines.append(f"| {g['kind']} | {g['count']} | {g['sizeMB']} |")
          lines += ['', '## Files', '', '| Kind | File | Size KB | SHA256 |', '| --- | --- | ---: | --- |']
          for e in entries:
              lines.append(f"| {e['kind']} | `{e['path']}` | {e['sizeKB']} | `{e['sha256'][:12]}` |")
          (root / 'docs/proofs/observability-evidence.md').write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit regenerated curated P95 panel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/demo_audit/images/panel_02.png audit/demo_audit/p95.csv docs/proofs/observability-evidence.md docs/proofs/observability-evidence.json
          if git diff --cached --quiet; then
            echo "No curated panel changes to commit."
          else
            git commit -m "fix(evidence): regenerate p95 latency panel with values"
            git push
          fi
