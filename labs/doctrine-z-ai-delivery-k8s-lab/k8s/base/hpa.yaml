apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: doctrine-z-api
  namespace: doctrine-z-lab
  labels:
    app: doctrine-z-api
    app.kubernetes.io/name: doctrine-z-api
    app.kubernetes.io/part-of: doctrine-z-ai-delivery-k8s-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: doctrine-z-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
