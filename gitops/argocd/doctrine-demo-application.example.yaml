apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: doctrine-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/flobehejohn/doctrine-demo.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: doctrine-demo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
